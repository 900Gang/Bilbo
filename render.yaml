services:
  - type: web
    name: task-manager
    runtime: node
    plan: free
    region: oregon
    branch: main
    buildCommand: cd client && npm ci --include=dev && npm run build && cd ../server && npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
